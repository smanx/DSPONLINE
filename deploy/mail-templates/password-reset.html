<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置 DSP极简网络云账户密码</title>
  </head>
  <body style="margin:0;background:#f4f6f8;color:#17212b;font-family:Arial,'Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f6f8;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce3e8;">
            <tr><td style="padding:28px 32px 12px;font-size:20px;font-weight:700;">DSP极简网络</td></tr>
            <tr><td style="padding:0 32px 18px;color:#4b5b68;font-size:15px;line-height:1.8;">我们收到了云账户密码重置请求。点击下方按钮设置新密码。</td></tr>
            <tr><td align="center" style="padding:8px 32px 28px;"><a href="https://dsponline.cn/?reset={{actionToken}}" style="display:inline-block;padding:12px 24px;background:#19766f;color:#ffffff;text-decoration:none;font-weight:700;">重置密码</a></td></tr>
            <tr><td style="padding:18px 32px;border-top:1px solid #e6ecef;color:#71808b;font-size:12px;line-height:1.7;">链接将在 30 分钟后失效。若你没有发起密码重置，请忽略本邮件并保留当前密码。</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
