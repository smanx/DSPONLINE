server {
    listen 80;
    listen [::]:80;
    server_name shanghai-node.example.invalid shanghai-ip.example.invalid;
    return 308 https://shanghai-node.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shanghai-node.example.invalid;

    ssl_certificate /etc/letsencrypt/live/shanghai-node.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanghai-node.example.invalid/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DSPIdleTLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/dsp-idle/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/dsp-idle.access.log;
    error_log /var/log/nginx/dsp-idle.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 70s;
        client_max_body_size 70m;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri @archived_immutable_asset;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location @archived_immutable_asset {
        root /var/www/dsp-idle/shared;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
