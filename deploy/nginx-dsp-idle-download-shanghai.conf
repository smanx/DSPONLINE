server {
    listen 80;
    listen [::]:80;
    server_name download.dsponline.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/dsp-idle-downloads/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://download.dsponline.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name download.dsponline.cn;

    ssl_certificate /etc/letsencrypt/live/download.dsponline.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.dsponline.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/dsp-idle-downloads/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/dsp-idle-downloads.access.log;
    error_log /var/log/nginx/dsp-idle-downloads.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /icon.svg {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /downloads/android/stable.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /downloads/desktop/stable/latest.yml {
        try_files $uri =404;
        default_type application/yaml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /downloads/desktop/stable/release.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /downloads/ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
