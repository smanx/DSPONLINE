server {
    listen 80;
    listen [::]:80;
    server_name shanghai-node.example.invalid shanghai-ip.example.invalid;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        return 302 https://dsponline.cn$request_uri;
    }
}
